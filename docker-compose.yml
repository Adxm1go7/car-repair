services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garage}
      POSTGRES_DB: ${POSTGRES_DB:-garage}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-garage}:${POSTGRES_PASSWORD:-garage}@db:5432/${POSTGRES_DB:-garage}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # The staff Origin check and the cookie's Secure flag read it, as the worker's links do.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # Only nginx (web, below) may say who the visitor is, via X-Forwarded-For.
      TRUSTED_PROXIES: 172.28.0.10
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped  # it closes Stripe forms of released holds
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-garage}:${POSTGRES_PASSWORD:-garage}@db:5432/${POSTGRES_DB:-garage}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-60}
      EMAIL_INTERVAL_SECONDS: ${EMAIL_INTERVAL_SECONDS:-5}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-bookings@example.test}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      api:
        condition: service_healthy  # the api runs the migrations on start
      mailpit:
        condition: service_started

  web:
    build: ./frontend
    ports:
      - "8080:80"
    networks:
      default:
        ipv4_address: 172.28.0.10  # fixed, so the api can trust it as the proxy
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25  # other containers get addresses from here, never web's

volumes:
  pgdata:
