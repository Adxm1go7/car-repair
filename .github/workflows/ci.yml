name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      # Stripe test-mode keys from the repository's secrets (docs/stripe-setup.md). Compose
      # passes them to the api and worker. Never demo mode here: see the check below.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_CLI_VERSION: 1.55.3
    steps:
      - uses: actions/checkout@v5
      - name: Stripe test keys are set
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ] || [ -z "$STRIPE_PUBLISHABLE_KEY" ]; then
            echo "::error::Add STRIPE_SECRET_KEY and STRIPE_PUBLISHABLE_KEY as repository secrets (docs/stripe-setup.md)"
            exit 1
          fi
          case "$STRIPE_SECRET_KEY" in
            sk_test_*) ;;
            *) echo "::error::STRIPE_SECRET_KEY must be a test key (sk_test_...)"; exit 1 ;;
          esac
      - name: Install the Stripe CLI
        run: |
          curl -fsSL -o stripe.tar.gz \
            "https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_CLI_VERSION}/stripe_${STRIPE_CLI_VERSION}_linux_x86_64.tar.gz"
          tar -xzf stripe.tar.gz stripe
          sudo mv stripe /usr/local/bin/stripe
          stripe version
      - name: Forward Stripe's webhooks to the api
        run: |
          secret=$(stripe listen --api-key "$STRIPE_SECRET_KEY" --print-secret)
          test -n "$secret"
          echo "::add-mask::$secret"
          echo "STRIPE_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
          # The events the api handles (app/api/stripe_webhook.py). This CLI version insists
          # on a list, and quits without forwarding anything if it gets none.
          events=checkout.session.completed,checkout.session.async_payment_succeeded
          events=$events,checkout.session.expired,refund.created,refund.updated,charge.refund.updated
          nohup stripe listen --api-key "$STRIPE_SECRET_KEY" --events "$events" \
            --forward-to localhost:8000/api/stripe/webhook > stripe-listen.log 2>&1 &
          sleep 5
          # It must still be running, or no webhook reaches the api.
          if ! kill -0 $! 2>/dev/null; then cat stripe-listen.log; exit 1; fi
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: curl -fsS http://localhost:8080/api/health | grep '"status":"ok"'
      - run: curl -fsS http://localhost:8080/api/services | grep '"slug":"mot-test"'
      - name: Availability returns slots for tomorrow
        run: |
          tomorrow=$(TZ=Europe/London date -d tomorrow +%F)
          url="http://localhost:8080/api/availability?services=mot-test&date=$tomorrow"
          curl -fsS "$url" | grep -F '"slots":[{'
      - name: Worker is running
        run: test "$(docker compose ps worker --format '{{.State}}')" = running
      - name: The api takes payments through Stripe
        run: curl -fsS http://localhost:8080/api/booking-policy | grep -F '"provider":"stripe"'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: End-to-end test
        run: npm test
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            stripe-listen.log
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
