# On the live demo Caddy (docker-compose.prod.yml, fixed at 172.28.0.11) is in front: only
# from it are X-Forwarded-For and X-Forwarded-Proto believed. Locally nothing has that
# address (it's outside the compose network's ip_range), so visitors are taken as they come.
map $realip_remote_addr $forwarded_proto {
    172.28.0.11 $http_x_forwarded_proto;
    default $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # The visitor's address, as Caddy saw it (Caddy replaces whatever the visitor sent).
    set_real_ip_from 172.28.0.11;
    real_ip_header X-Forwarded-For;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Only the one address nginx believes: the api trusts nginx alone (TRUSTED_PROXIES).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # The api sends its own nosniff; don't send it twice.
        proxy_hide_header X-Content-Type-Options;
    }

    # The page itself is always checked again, so a new release is picked up at once.
    # The hashed files under /assets can be cached as usual.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
